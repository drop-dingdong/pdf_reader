[package]
name = "app"
description = "PDF 阅读器桌面应用（egui/eframe 壳）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pdfcore = { path = "../pdfcore" }
backend-pdfium = { path = "../backend-pdfium" }
# UI：默认特性会带上 wgpu；这里显式选 glow（OpenGL）后端以缩小体积、提升老机器兼容性。
# x11/wayland 必须显式开启（关闭默认特性后 winit 没有平台后端，会直接编译失败）；
# system_fonts 用于加载系统字体，否则中文界面与 CJK 文件名会显示成方块。
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "system_fonts",
    "clipboard",
    "links",
    "x11",
    "wayland",
] }
egui = "0.37"
